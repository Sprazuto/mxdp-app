<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#061206"/>
    </linearGradient>
    <radialGradient id="playgroundGlow" cx="50%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="170" rx="250" ry="150" fill="url(#playgroundGlow)"/>
  <g transform="translate(200, 150)">
    <!-- Safe playground: soft surfaces, equipment -->
    <!-- Rubberized surface pattern -->
    <pattern id="rubber" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="2" fill="#22d3ee" opacity="0.08"/>
    </pattern>
    <rect x="-200" y="50" width="400" height="100" fill="url(#rubber)"/>
    <!-- Play equipment silhouettes -->
    <g fill="#22d3ee" opacity="0.5">
      <!-- Slide -->
      <path d="M-140,-20 L-100,-60 Q-80,-70 -60,-60 L-60,50 L-100,50 Z"/>
      <path d="M-125,-45 L-115,-45 M-125,-35 L-115,-35" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Swing set -->
      <line x1="60" y1="-65" x2="60" y2="20" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <g transform="translate(60, 20)">
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
        <line x1="-15" y1="0" x2="-15" y2="35" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
        <ellipse cx="-15" cy="35" rx="8" ry="5" fill="#22d3ee" opacity="0.4"/>
        <line x1="15" y1="0" x2="15" y2="35" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
        <ellipse cx="15" cy="35" rx="8" ry="5" fill="#22d3ee" opacity="0.4"/>
      </g>
      <!-- Climbing structure -->
      <g fill="#22d3ee" opacity="0.4">
        <rect x="120" y="-50" width="8" height="70" rx="4"/>
        <line x1="100" y1="-40" x2="140" y2="-40" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
        <line x1="100" y1="-20" x2="140" y2="-20" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
        <line x1="100" y1="0" x2="140" y2="0" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
        <line x1="100" y1="20" x2="140" y2="20" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
      </g>
      <!-- Sandbox -->
      <rect x="-180" y="20" width="70" height="50" rx="10" fill="#22d3ee" opacity="0.3"/>
      <g fill="#22d3ee" opacity="0.5">
        <circle cx="-160" cy="35" r="5"/>
        <circle cx="-145" cy="45" r="4"/>
        <circle cx="-130" cy="30" r="3"/>
        <circle cx="-120" cy="55" r="4"/>
      </g>
    </g>
    <!-- Safety padding indicators -->
    <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6,4">
      <rect x="-190" y="-60" width="380" height="160" rx="20"/>
    </g>
    <!-- Floating safety badges -->
    <g fill="#22d3ee" opacity="0.4">
      <circle cx="-170" cy="-80" r="3"/>
      <circle cx="170" cy="-80" r="3"/>
      <circle cx="-180" cy="90" r="2.5"/>
      <circle cx="180" cy="90" r="2.5"/>
    </g>
  </g>
</svg>
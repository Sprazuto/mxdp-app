<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061a"/>
      <stop offset="100%" stop-color="#0d0312"/>
    </linearGradient>
    <radialGradient id="steamGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="130" rx="220" ry="130" fill="url(#steamGlow)"/>
  <g transform="translate(200, 150)">
    <!-- STEAM lab: workstations with robotics/coding -->
    <g fill="#a855f7" opacity="0.5">
      <!-- Workbenches -->
      <rect x="-160" y="-70" width="90" height="45" rx="6"/>
      <rect x="70" y="-70" width="90" height="45" rx="6"/>
      <rect x="-160" y="25" width="90" height="45" rx="6"/>
      <rect x="70" y="25" width="90" height="45" rx="6"/>
    </g>
    <!-- Monitor screens -->
    <g fill="#a855f7" opacity="0.7">
      <rect x="-155" y="-65" width="80" height="12" rx="2"/>
      <rect x="75" y="-65" width="80" height="12" rx="2"/>
      <rect x="-155" y="30" width="80" height="12" rx="2"/>
      <rect x="75" y="30" width="80" height="12" rx="2"/>
    </g>
    <!-- Code/robotics indicators on screens -->
    <g stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M-150,-60 L-90,-60 M-150,-55 L-90,-55 M-150,-50 L-110,-50"/>
      <path d="M80,-60 L140,-60 M80,-55 L140,-55 M80,-50 L120,-50"/>
      <path d="M-150,35 L-90,35 M-150,40 L-90,40 M-150,45 L-110,45"/>
      <path d="M80,35 L140,35 M80,40 L140,40 M80,45 L120,45"/>
    </g>
    <!-- Robot arms / 3D printers -->
    <g stroke="#a855f7" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-50,-40 L-50,-10 Q-40,-5 -30,-10 L-30,10" transform="rotate(-15)"/>
      <path d="M30,-40 L30,-10 Q40,-5 50,-10 L50,10" transform="rotate(15)"/>
    </g>
    <!-- Gear/cog symbols for engineering -->
    <g stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.4">
      <circle cx="-100" cy="80" r="12"/>
      <g transform="translate(-100, 80)">
        <line x1="0" y1="-15" x2="0" y2="-18"/>
        <line x1="0" y1="15" x2="0" y2="18"/>
        <line x1="-15" y1="0" x2="-18" y2="0"/>
        <line x1="15" y1="0" x2="18" y2="0"/>
      </g>
      <circle cx="100" cy="80" r="12"/>
      <g transform="translate(100, 80)">
        <line x1="0" y1="-15" x2="0" y2="-18"/>
        <line x1="0" y1="15" x2="0" y2="18"/>
        <line x1="-15" y1="0" x2="-18" y2="0"/>
        <line x1="15" y1="0" x2="18" y2="0"/>
      </g>
    </g>
    <!-- Floating particles: innovation energy -->
    <g fill="#a855f7" opacity="0.5">
      <circle cx="-180" cy="-110" r="1.5"/>
      <circle cx="180" cy="-110" r="1.5"/>
      <circle cx="-190" cy="50" r="1"/>
      <circle cx="190" cy="50" r="1"/>
      <circle cx="-80" cy="-120" r="1.2"/>
      <circle cx="80" cy="-120" r="1.2"/>
      <circle cx="-140" cy="110" r="1"/>
      <circle cx="140" cy="110" r="1"/>
    </g>
  </g>
</svg>
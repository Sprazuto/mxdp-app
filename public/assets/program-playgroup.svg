      <stop offset="0%" stop-color="#1f0a1a"/>
      <stop offset="100%" stop-color="#140612"/>
    </linearGradient>
    <radialGradient id="playGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.18"/>

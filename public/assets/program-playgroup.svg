      <circle cx="22" cy="-25" r="5"/>
      <circle cx="-13" cy="22" r="5"/>
      <circle cx="47" cy="27" r="5"/>
    </g>
    <!-- Sparkle accents for creativity -->
    <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.6">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f1a"/>
      <stop offset="100%" stop-color="#061412"/>
    </linearGradient>
    <radialGradient id="toddlerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="120" rx="180" ry="100" fill="url(#toddlerGlow)"/>
  <g transform="translate(200, 150)">
    <!-- Gentle growth spiral for toddler -->
    <g stroke="#22d3ee" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M0,-8 A8,8 0 1,1 0,8 A8,8 0 1,1 0,-8" transform="rotate(-90)"/>
      <path d="M0,-18 A18,18 0 1,1 0,18 A18,18 0 1,1 0,-18" transform="rotate(-45)" opacity="0.5" stroke-width="1.5"/>
      <path d="M0,-30 A30,30 0 1,1 0,30 A30,30 0 1,1 0,-30" opacity="0.3" stroke-width="1"/>
    </g>
    <!-- Central seed/growth point -->
    <circle r="3" fill="#22d3ee"/>
    <circle r="6" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle r="10" stroke="#22d3ee" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Soft floating shapes suggesting play/learning -->
    <g fill="#22d3ee" opacity="0.4">
      <ellipse cx="-70" cy="-60" rx="6" ry="4" transform="rotate(-15)"/>
      <ellipse cx="65" cy="-55" rx="5" ry="3.5" transform="rotate(20)"/>
      <ellipse cx="-55" cy="40" rx="4.5" ry="3" transform="rotate(-30)"/>
      <ellipse cx="70" cy="45" rx="5" ry="3.5" transform="rotate(10)"/>
    </g>
    <!-- Small growth indicators -->
    <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.5">
      <path d="M-80,20 Q-75,10 -70,20" stroke-linecap="round"/>
      <path d="M85,25 Q90,15 95,25" stroke-linecap="round"/>
    </g>
  </g>
</svg>
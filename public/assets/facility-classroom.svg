<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06181f"/>
      <stop offset="100%" stop-color="#031016"/>
    </linearGradient>
    <radialGradient id="classGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#06b6d4" stroke-width="0.5" opacity="0.1"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#06b6d4" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#grid)"/>
  <ellipse cx="200" cy="120" rx="220" ry="130" fill="url(#classGlow)"/>
  <g transform="translate(200, 150)">
    <!-- Smart classroom layout: desks with tech -->
    <g fill="#06b6d4" opacity="0.5">
      <!-- Teacher station -->
      <rect x="-150" y="-70" width="50" height="30" rx="4"/>
      <rect x="-140" y="-78" width="30" height="10" rx="2" fill="#06b6d4" opacity="0.7"/>
      <!-- Student desks in rows -->
      <g fill="#06b6d4" opacity="0.4">
        <rect x="-100" y="-40" width="28" height="20" rx="3"/>
        <rect x="-60" y="-40" width="28" height="20" rx="3"/>
        <rect x="-20" y="-40" width="28" height="20" rx="3"/>
        <rect x="20" y="-40" width="28" height="20" rx="3"/>
        <rect x="60" y="-40" width="28" height="20" rx="3"/>
        <rect x="100" y="-40" width="28" height="20" rx="3"/>
      </g>
      <g fill="#06b6d4" opacity="0.4">
        <rect x="-100" y="-10" width="28" height="20" rx="3"/>
        <rect x="-60" y="-10" width="28" height="20" rx="3"/>
        <rect x="-20" y="-10" width="28" height="20" rx="3"/>
        <rect x="20" y="-10" width="28" height="20" rx="3"/>
        <rect x="60" y="-10" width="28" height="20" rx="3"/>
        <rect x="100" y="-10" width="28" height="20" rx="3"/>
      </g>
      <g fill="#06b6d4" opacity="0.4">
        <rect x="-100" y="20" width="28" height="20" rx="3"/>
        <rect x="-60" y="20" width="28" height="20" rx="3"/>
        <rect x="-20" y="20" width="28" height="20" rx="3"/>
        <rect x="20" y="20" width="28" height="20" rx="3"/>
        <rect x="60" y="20" width="28" height="20" rx="3"/>
        <rect x="100" y="20" width="28" height="20" rx="3"/>
      </g>
    </g>
    <!-- Interactive display at front -->
    <g stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.7">
      <rect x="-80" y="-95" width="160" height="15" rx="3"/>
      <line x1="-70" y1="-90" x2="70" y2="-90" stroke-width="1" opacity="0.5"/>
      <line x1="-50" y1="-92" x2="50" y2="-92" stroke-width="1" opacity="0.3"/>
    </g>
    <!-- WiFi/data flow indicators -->
    <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="4,3">
      <path d="M-160,-80 Q-140,-100 -120,-80" stroke-linecap="round"/>
      <path d="M160,-80 Q140,-100 120,-80" stroke-linecap="round"/>
      <path d="M-160,60 Q-140,80 -120,60" stroke-linecap="round"/>
      <path d="M160,60 Q140,80 120,60" stroke-linecap="round"/>
    </g>
    <!-- Floating data particles -->
    <g fill="#06b6d4" opacity="0.5">
      <circle cx="-180" cy="-100" r="1.5"/>
      <circle cx="180" cy="-100" r="1.5"/>
      <circle cx="-170" cy="80" r="1"/>
      <circle cx="170" cy="80" r="1"/>
      <circle cx="-120" cy="-50" r="1.2"/>
      <circle cx="120" cy="-50" r="1.2"/>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181f33"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <radialGradient id="macroGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="texture" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.5" fill="#22d3ee" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#texture)"/>
  <ellipse cx="960" cy="540" rx="600" ry="350" fill="url(#macroGlow)"/>
  <g transform="translate(960, 540)">
    <!-- Macro detail: interconnected nodes suggesting learning network -->
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.5">
      <!-- Central cluster -->
      <circle r="3" fill="#22d3ee"/>
      <g fill="#22d3ee" opacity="0.7">
        <circle cx="0" cy="0" r="2.5"/>
        <circle cx="45" cy="-25" r="2"/>
        <circle cx="-40" cy="-30" r="1.8"/>
        <circle cx="50" cy="20" r="2.2"/>
        <circle cx="-55" cy="15" r="1.5"/>
        <circle cx="20" cy="50" r="1.8"/>
        <circle cx="-30" cy="45" r="1.5"/>
      </g>
      <!-- Connections -->
      <line x1="0" y1="0" x2="45" y2="-25" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-40" y2="-30" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="50" y2="20" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-55" y2="15" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="20" y2="50" stroke-width="1" opacity="0.4"/>
      <line x1="0" y1="0" x2="-30" y2="45" stroke-width="1" opacity="0.4"/>
      <!-- Outer ring connections -->
      <line x1="45" y1="-25" x2="80" y2="-50" stroke-width="0.8" opacity="0.3"/>
      <line x1="50" y1="20" x2="85" y2="45" stroke-width="0.8" opacity="0.3"/>
      <line x1="-55" y1="15" x2="-90" y2="35" stroke-width="0.8" opacity="0.3"/>
    </g>
    <!-- Subtle data visualization bars -->
    <g fill="#22d3ee" opacity="0.4">
      <rect x="-200" y="100" width="4" height="30" rx="2"/>
      <rect x="-190" y="100" width="4" height="45" rx="2"/>
      <rect x="-180" y="100" width="4" height="25" rx="2"/>
      <rect x="-170" y="100" width="4" height="50" rx="2"/>
      <rect x="160" y="100" width="4" height="35" rx="2"/>
      <rect x="170" y="100" width="4" height="55" rx="2"/>
      <rect x="180" y="100" width="4" height="20" rx="2"/>
      <rect x="190" y="100" width="4" height="40" rx="2"/>
    </g>
    <!-- Floating particles suggesting evidence/data points -->
    <g fill="#22d3ee" opacity="0.5">
      <circle cx="-280" cy="-180" r="1.2"/>
      <circle cx="260" cy="-160" r="1"/>
      <circle cx="-300" cy="-40" r="1.5"/>
      <circle cx="280" cy="-20" r="0.8"/>
      <circle cx="-220" cy="140" r="1"/>
      <circle cx="200" cy="160" r="1.3"/>
      <circle cx="-150" cy="-220" r="1"/>
      <circle cx="140" cy="-200" r="1.2"/>
    </g>
  </g>
</svg>
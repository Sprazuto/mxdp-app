<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1a"/>
      <stop offset="50%" stop-color="#0f141f"/>
      <stop offset="100%" stop-color="#141a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="320" rx="700" ry="400" fill="url(#glow)" filter="url(#softGlow)"/>
  <g transform="translate(960, 540)">
    <g stroke="#22d3ee" stroke-width="2" opacity="0.4" fill="none">
      <path d="M-400,-180 Q0,-300 400,-180" stroke-dasharray="20,15"/>
      <path d="M-450,-120 Q0,-220 450,-120" stroke-dasharray="25,20"/>
      <path d="M-500,-60 Q0,-140 500,-60" stroke-dasharray="30,25"/>
    </g>
    <circle r="3" fill="#22d3ee" opacity="0.8"/>
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6">
      <circle r="24"/>
      <circle r="42"/>
      <circle r="60"/>
      <path d="M0,-72 L0,-84 M0,72 L0,84 M-72,0 L-84,0 M72,0 L84,0" stroke-width="2"/>
    </g>
    <g fill="#22d3ee" opacity="0.5">
      <circle cx="-180" cy="-140" r="1.5"/>
      <circle cx="200" cy="-100" r="1"/>
      <circle cx="-220" cy="60" r="1.2"/>
      <circle cx="240" cy="80" r="0.8"/>
      <circle cx="-100" cy="160" r="1"/>
      <circle cx="160" cy="140" r="1.3"/>
    </g>
  </g>
  <rect x="0" y="900" width="1920" height="180" fill="url(#bg)"/>
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
</svg>
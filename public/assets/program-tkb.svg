<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1a"/>
      <stop offset="100%" stop-color="#0d0612"/>
    </linearGradient>
    <radialGradient id="tkbGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="130" rx="200" ry="120" fill="url(#tkbGlow)"/>
  <g transform="translate(200, 150)">
    <!-- Advanced readiness: rocket/launch metaphor -->
    <g fill="#a855f7" opacity="0.7">
      <!-- Rocket body -->
      <path d="M-10,-60 L-10,30 L10,30 L10,-60 Z" rx="5"/>
      <!-- Nose cone -->
      <path d="M-15,-60 L0,-85 L15,-60 Z"/>
      <!-- Fins -->
      <path d="M-10,20 L-25,45 L-10,30 Z"/>
      <path d="M10,20 L25,45 L10,30 Z"/>
    </g>
    <!-- Exhaust/energy -->
    <g fill="#a855f7" opacity="0.5">
      <ellipse cx="0" cy="45" rx="8" ry="6"/>
      <ellipse cx="-5" cy="55" rx="4" ry="4"/>
      <ellipse cx="5" cy="55" rx="4" ry="4"/>
      <ellipse cx="0" cy="65" rx="2" ry="3"/>
    </g>
    <!-- Stars/milestones achieved -->
    <g fill="#a855f7" opacity="0.6">
      <polygon points="0,-10 -2,-3 -10,-3 -3,1 -5,9 0,5 5,9 -3,1 10,-3 2,-3" transform="translate(-70, -50)"/>
      <polygon points="0,-10 -2,-3 -10,-3 -3,1 -5,9 0,5 5,9 -3,1 10,-3 2,-3" transform="translate(70, -50)" scale="0.8"/>
      <polygon points="0,-10 -2,-3 -10,-3 -3,1 -5,9 0,5 5,9 -3,1 10,-3 2,-3" transform="translate(-80, 40)" scale="0.6"/>
      <polygon points="0,-10 -2,-3 -10,-3 -3,1 -5,9 0,5 5,9 -3,1 10,-3 2,-3" transform="translate(80, 40)" scale="0.6"/>
    </g>
    <!-- Trajectory path -->
    <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="8,6">
      <path d="M0,-60 Q-100,-100 -150,-120" stroke-linecap="round"/>
      <path d="M0,-60 Q100,-100 150,-120" stroke-linecap="round"/>
    </g>
    <!-- Checkmarks for competencies -->
    <g stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M-100,80 L-90,90 L-75,75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-30,80 L-20,90 L-5,75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40,80 L50,90 L65,75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M110,80 L120,90 L135,75" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>